<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Leitura Diária</title>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FBF8F1">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">

<!-- iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Leitura">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&amp;family=Lora:wght@400;600&amp;family=Merriweather:wght@400;700&amp;display=swap">

<style>
  :root { color-scheme: light; --bg:#FBF8F1; --fg:#222; --muted:#6f6a60; --line:#e6dfd1; --accent:#222;
          --serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px clamp(18px, 5vw, 32px) 76px;
    padding-top: max(28px, env(safe-area-inset-top));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.6;
    max-width: 680px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 28px; height: 28px; border-radius: 7px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .topbar h1 { margin: 0; }
  .row { display: flex; gap: 8px; }
  input[type=url] {
    flex: 1; font-size: 16px; padding: 12px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--fg); min-width: 0;
  }
  button {
    font-size: 16px; padding: 12px 16px; border: none; border-radius: 8px;
    background: var(--accent); color: var(--bg); cursor: pointer; white-space: nowrap;
  }
  button:disabled { opacity: .5; cursor: wait; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .actions button { font-size: 13px; padding: 8px 12px; background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .actions button svg { vertical-align: -2px; margin-right: 5px; }
  .actions button.icon-btn { padding: 8px 10px; }
  .actions button.icon-btn svg { margin-right: 0; display: block; }
  .aa { font-size: 14px; font-weight: 600; line-height: 1; }
  .color-a { font-family: var(--serif); font-size: 15px; font-weight: 700; line-height: 1; border-bottom: 3px solid #222; padding-bottom: 1px; }
  .confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .confirm.hidden { display: none; }
  .confirm button { font-size: 12px; padding: 6px 10px; }
  .confirm #confirmYes { background: #a33; color: #fff; }
  .confirm #confirmNo { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
  #status { font-size: 14px; color: var(--muted); margin-top: 14px; min-height: 20px; }
  #output {
    margin-top: 16px; white-space: pre-wrap; word-wrap: break-word;
    font-family: var(--serif); font-size: 18px; line-height: 1.8;
    max-width: 34em; margin-inline: auto;
    text-align: justify; hyphens: auto;
  }
  #output p { margin: 0 0 1.1em; }
  #output img { max-width: 100%; height: auto; border-radius: 6px; display: block; margin: 1.2em auto; }
  #output h1, #output h2, #output h3 { font-weight: 600; }
  #output ul.images { list-style: none; padding-left: 0; }
  #output ul.images li { margin: 14px 0; }
  #output p.caption { font-size: 15px; color: var(--muted); margin-top: -4px; line-height: 1.45; text-align: left; hyphens: none; }
  .brand { font-family: var(--serif); }
  .article-head { margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .article-head h1 { margin: 0 0 6px; line-height: 1.25; }
  .article-sub { font-family: var(--serif); font-size: 15px; color: var(--muted); margin: 6px 0 0; line-height: 1.5; }
  .article-head a { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; color: var(--muted); }
  .article-head .back-news { background: none; border: 0; padding: 0; margin: 0 0 8px; color: var(--muted); font-size: 13px; cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .article-head .back-news:hover { text-decoration: underline; }
  .to-top { position: fixed; right: 16px; bottom: 68px; width: 44px; height: 44px; border-radius: 50%; padding: 0; font-size: 18px; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .read-footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; gap: 6px;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    background: rgba(251,248,241,.95); border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
  .read-footer.hidden { display: none; }

  .tabs { display: flex; gap: 18px; margin: -4px 0 16px; border-bottom: 1px solid var(--line); }
  .tabs button { background: transparent; color: var(--muted); border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 0 10px; font-size: 15px; }
  .tabs button.active { color: var(--fg); border-bottom-color: var(--accent); }
  .sections { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .sections button { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .sections button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .row-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 7px; }
  .subs-row { margin: 0 0 16px; padding: 10px 0 0 14px; border-left: 2px solid #dfe6ef; }
  .sections.subs { margin: 0; }
  .sections.subs button { font-size: 12px; padding: 5px 10px; background: #eef2f7; border-color: #eef2f7; color: #36506b; }
  .sections.subs button:hover { background: #e2e9f2; }
  .sections.subs button.active { background: #36506b; border-color: #36506b; color: #fff; }
  .news-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; }
  .news-item:hover .news-title { text-decoration: underline; }
  .news-info { flex: 1; min-width: 0; }
  .news-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 16px; line-height: 1.4; }
  .news-sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 1.4; color: var(--muted); margin-top: 3px; }
  .news-date { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .news-item img { width: 86px; height: 58px; object-fit: cover; border-radius: 6px; flex: none; }
  .news-item.read .news-title { color: var(--muted); }
  .news-item.read img { opacity: .6; }
  .news-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
  .news-top .row-label { margin: 0; }
  .periods { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .periods button { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 12px; }
  .periods button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .refresh { background: transparent; color: var(--muted); border: none; font-size: 12px; padding: 2px 4px; }
  .refresh:hover { color: var(--fg); }
  #output a { color: inherit; }
  #output h1, #output h2, #output h3 { line-height: 1.25; margin-top: 1.4em; }
  #output pre, #output code { background: rgba(127,127,127,.12); padding: 2px 4px; border-radius: 4px; font-size: 14px; overflow-x: auto; }
  #output pre { padding: 10px; }
  #output blockquote { border-left: 3px solid var(--line); margin: 0; padding-left: 12px; color: var(--muted); }
  hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
  .hidden { display: none; }
  .history { margin-top: 24px; font-size: 14px; }
  .history h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .history a { display: block; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<div class="topbar">
  <h1 class="brand"><img src="icon-192.png" alt="" width="28" height="28">Leitura Diária</h1>
</div>

<nav class="tabs">
  <button id="tabReader" type="button" class="active">Leitor</button>
  <button id="tabNews" type="button">Notícias</button>
</nav>

<div id="readerView">

<div class="row">
  <input type="url" id="url" placeholder="Cole a URL do artigo" aria-label="URL do artigo" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="go">Ler</button>
</div>

<div class="actions">
  <button id="btnHome" class="icon-btn" type="button" aria-label="Ir para o início" title="Início"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
  <button id="btnClear" class="icon-btn" type="button" aria-label="Limpar histórico" title="Limpar histórico"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M4 6h16M9 6V4h6v2M18 6l-1 14H7L6 6M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
  <button id="btnFont" class="icon-btn" type="button" aria-label="Mudar fonte" title="Fonte: Georgia"><span class="aa">Aa</span></button>
  <button id="btnColor" class="icon-btn" type="button" aria-label="Mudar cor do texto" title="Cor do texto"><span class="color-a">A</span></button>
  <button id="fontMinus" type="button" aria-label="Diminuir fonte">A−</button>
  <button id="fontPlus" type="button" aria-label="Aumentar fonte">A+</button>
</div>

<div id="confirmClear" class="confirm hidden" role="alertdialog" aria-label="Confirmar limpeza do histórico">
  <span>Apagar todo o histórico?</span>
  <button id="confirmYes" type="button">Apagar</button>
  <button id="confirmNo" type="button">Cancelar</button>
</div>

<p class="hint">Extrai o texto via r.jina.ai.</p>

<div id="status"></div>
<article id="output"></article>

<div class="history hidden" id="historyBox">
  <h2>Recentes</h2>
  <div id="historyList"></div>
</div>

</div>

<div id="newsView" class="hidden">
  <div class="news-top">
    <div class="row-label">Seções</div>
    <button id="newsRefresh" class="refresh" type="button" title="Atualizar notícias">↻ Atualizar</button>
  </div>
  <div class="sections" id="newsSections"></div>
  <div class="subs-row hidden" id="subsRow">
    <div class="row-label" id="subsLabel">Tópicos</div>
    <div class="sections subs" id="newsSubs"></div>
  </div>
  <div class="periods" id="newsPeriods"></div>
  <div id="newsStatus" class="hint"></div>
  <div id="newsList"></div>
</div>

<button id="toTop" class="to-top hidden" type="button" aria-label="Voltar ao topo">↑</button>

<div id="readFooter" class="read-footer hidden">
  <span id="readPct">0%</span>
  <span>·</span>
  <span id="readPage">página 1 de 1</span>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const input = $('url'), goBtn = $('go'), status = $('status'), output = $('output');
  const historyBox = $('historyBox'), historyList = $('historyList');
  const KEY = 'leitor_limpo_history_v1';

  // --- Histórico ---
  function getHistory() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; }
  }
  function saveHistory(url, title) {
    let h = getHistory().filter(x => x.url !== url);
    h.unshift({ url, title: title || url, ts: Date.now() });
    h = h.slice(0, 20);
    localStorage.setItem(KEY, JSON.stringify(h));
    renderHistory();
  }
  function renderHistory() {
    const h = getHistory();
    if (!h.length) { historyBox.classList.add('hidden'); return; }
    historyBox.classList.remove('hidden');
    historyList.innerHTML = '';
    h.forEach(item => {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = item.title;
      a.title = item.url;
      a.onclick = (e) => { e.preventDefault(); input.value = item.url; load(); };
      historyList.appendChild(a);
    });
  }
  const confirmClear = $('confirmClear');
  $('btnClear').onclick = () => {
    if (!getHistory().length) return;
    confirmClear.classList.remove('hidden');
  };
  $('confirmYes').onclick = () => {
    localStorage.removeItem(KEY);
    localStorage.removeItem(READ_KEY);
    renderHistory();
    confirmClear.classList.add('hidden');
  };
  $('confirmNo').onclick = () => confirmClear.classList.add('hidden');

  $('btnHome').onclick = () => {
    loadToken++;
    input.value = '';
    output.innerHTML = '';
    status.textContent = '';
    document.title = 'Leitura Diária';
    confirmClear.classList.add('hidden');
    showView('reader');
    try { history.replaceState(null, '', location.pathname); } catch {}
    updateReadingProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // --- Markdown mínimo -> HTML (r.jina.ai retorna Markdown) ---
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Só deixa passar URLs seguras (bloqueia javascript:, data:, vbscript: etc.)
  function safeUrl(u, forImage) {
    const s = String(u).trim();
    if (/^https?:\/\//i.test(s)) return s;
    if (!forImage && (/^mailto:/i.test(s) || !/^[a-z][a-z0-9+.-]*:/i.test(s))) return s;
    return null;
  }

  // Remove o bloco de metadados que o r.jina.ai coloca no topo
  function stripJinaMeta(md) {
    const meta = /^(Title|URL Source|Published Time|Markdown Content|Warning):/;
    const lines = md.split('\n');
    let i = 0;
    while (i < lines.length && (lines[i].trim() === '' || meta.test(lines[i]))) i++;
    return lines.slice(i);
  }

  function mdToHtml(md) {
    const lines = stripJinaMeta(String(md).replace(/\r\n?/g, '\n'));
    let html = '', inCode = false, inList = false, lastWasImage = false;
    const para = [];
    const inline = (t) => {
      t = esc(t);
      t = t.replace(/!\[([^\]]*)\]\(\s*((?:[^()\s]|\([^()\s]*\))+)(?:\s+(?:&quot;.*?&quot;|&#39;.*?&#39;))?\s*\)/g, (m, alt, src) => {
        const u = safeUrl(src, true);
        alt = alt.replace(/^Image\s+[\d,\s]+:\s*/, '');
        return u ? `<img alt="${alt}" src="${u}" loading="lazy">` : '';
      });
      t = t.replace(/\[((?:[^\[\]]|\[[^\[\]]*\])*)\]\(\s*((?:[^()\s]|\([^()\s]*\))+)(?:\s+(?:&quot;.*?&quot;|&#39;.*?&#39;))?\s*\)/g, (m, label, href) => {
        const u = safeUrl(href, false);
        return u ? `<a href="${u}" target="_blank" rel="noopener noreferrer">${label}</a>` : label;
      });
      t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
      return t;
    };
    const flushPara = () => {
      if (!para.length) return;
      const content = inline(para.join(' '));
      para.length = 0;
      if (/^(?:<img\b[^>]*>\s*)+$/.test(content)) {
        html += '<p>' + content + '</p>';
        lastWasImage = true;
      } else {
        html += '<p' + (lastWasImage ? ' class="caption"' : '') + '>' + content + '</p>';
        lastWasImage = false;
      }
    };
    const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
    for (const line of lines) {
      if (/^```/.test(line)) { flushPara(); closeList(); lastWasImage = false; inCode = !inCode; html += inCode ? '<pre>' : '</pre>'; continue; }
      if (inCode) { html += esc(line) + '\n'; continue; }
      if (/^#{1,6}\s/.test(line)) {
        flushPara(); closeList(); lastWasImage = false;
        const m = line.match(/^(#{1,6})\s+(.*)$/);
        html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;
        continue;
      }
      if (/^\s*[-*+]\s/.test(line)) {
        flushPara(); lastWasImage = false;
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + inline(line.replace(/^\s*[-*+]\s+/, '')) + '</li>';
        continue;
      }
      if (/^\s*>\s/.test(line)) { flushPara(); closeList(); lastWasImage = false; html += '<blockquote>' + inline(line.replace(/^\s*>\s?/, '')) + '</blockquote>'; continue; }
      if (/^---+$/.test(line.trim())) { flushPara(); closeList(); lastWasImage = false; html += '<hr>'; continue; }
      if (line.trim() === '') { flushPara(); continue; }
      flushPara(); closeList();
      para.push(line.trim());
    }
    flushPara(); closeList();
    if (inCode) html += '</pre>';
    // Seção "Images:" que o Jina anexa ao final (X-With-Images-Summary)
    html = html.replace(/<p>Images:<\/p>/g, '<h2>Imagens</h2>')
               .replace(/<ul>(?=\s*(?:<li><img[^>]*><\/li>\s*)+<\/ul>)/g, '<ul class="images">');
    return html;
  }

  function extractTitle(md) {
    const t = md.match(/^Title:\s*(.+)$/m);
    if (t) return t[1].trim();
    const h = md.match(/^#\s+(.+)$/m);
    return h ? h[1].trim() : null;
  }

  // Sites em que o Jina precisa de um seletor para não trazer menu/rodapé.
  // "inline" é um seletor mais amplo, usado só para achar a posição das figuras.
  const SITE_SELECTORS = [
    { host: /(^|\.)folha\.uol\.com\.br$/i,
      selectors: ['[data-news-content-text]', '[itemprop="articleBody"]'],
      inline: 'article' }
  ];

  function siteRuleFor(url) {
    try {
      const host = new URL(url).hostname;
      return SITE_SELECTORS.find(r => r.host.test(host)) || null;
    } catch { return null; }
  }

  async function fetchArticle(url) {
    const endpoint = 'https://r.jina.ai/' + url;
    const get = async (headers) => {
      const res = await fetch(endpoint, { headers });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    };
    const rule = siteRuleFor(url);
    if (!rule) return { text: await get({ 'Accept': 'text/plain' }), subtitle: '' };
    const tryGet = async (headers) => {
      try { return await get(headers); } catch { return ''; }
    };
    const [a, b, full] = await Promise.all([
      tryGet({ 'Accept': 'text/plain', 'X-Target-Selector': rule.selectors[0] }),
      tryGet({ 'Accept': 'text/plain', 'X-Target-Selector': rule.selectors[1] }),
      tryGet({ 'Accept': 'text/plain', 'X-Target-Selector': rule.inline })
    ]);
    const contentLen = (s) => String(s || '').split('Markdown Content:').pop().trim().length;
    const useA = contentLen(a) >= contentLen(b);
    const body = useA ? a : b;
    const usedSel = useA ? rule.selectors[0] : rule.selectors[1];
    // Se nenhum seletor achar conteúdo, volta para a leitura completa
    if (contentLen(body) < 400) {
      return { text: await get({ 'Accept': 'text/plain' }), subtitle: '' };
    }
    const inlined = inlineArticle(body, full);
    if (inlined) return inlined;
    // Sem como posicionar as figuras: usa a lista de imagens no rodapé
    return {
      text: await get({
        'Accept': 'text/plain',
        'X-Target-Selector': usedSel,
        'X-With-Images-Summary': 'true'
      }),
      subtitle: ''
    };
  }

  // Monta o texto do corpo preservando figuras e legendas na posição original:
  // percorre o container, alinha os parágrafos do corpo e insere só as figuras.
  function inlineArticle(bodyMd, fullMd) {
    const blocks = (md) => String(md).split('Markdown Content:').pop()
      .split(/\n{2,}/).map(b => b.trim()).filter(Boolean);
    const plain = (s) => s
      .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
      .replace(/[*_`#>]/g, '')
      .replace(/\s+/g, ' ').trim();
    const promo = (b) => /login\.folha\.com\.br\/newsletter|Receba no seu email/i.test(b);
    const body = blocks(bodyMd).filter(b => !promo(b));
    const art = blocks(fullMd).filter(b => !promo(b));
    if (!body.length || !art.length) return null;
    const isFigure = (b) => b.indexOf('![') >= 0 && plain(b) === '';
    const same = (a, b) => !!a && !!b && (a === b || (a.length > 30 && b.length > 30 && a.slice(0, 80) === b.slice(0, 80)));
    const figs = [];
    let seen = 0, start = -1;
    for (let i = 0; i < art.length; i++) {
      const b = art[i];
      if (isFigure(b)) {
        // figuras antes do início do corpo (foto do colunista etc.) são ignoradas
        if (seen === 0) continue;
        let caption = '';
        const next = art[i + 1];
        if (next && !isFigure(next) && !same(plain(next), plain(body[seen])) && plain(next).length >= 25) {
          caption = next;
          i++;
        }
        figs.push({ after: seen, image: b, caption });
        continue;
      }
      if (same(plain(b), plain(body[seen]))) {
        if (start < 0) start = i;
        seen++;
        if (seen === body.length) break; // fim do corpo do artigo
      }
    }
    if (seen < body.length) return null;
    let subtitle = '';
    const uiText = /link externo|abre p[áa]gina|diminuir fonte|aumentar fonte|edi[çc][ãa]o impressa|compartilhar|recurso exclusivo|fa[çc]a login|assinantes?|acessos? por dia|conte[úu]dos da folha|link presente|gostou deste texto|benef[íi]cio do assinante|dar de presente/i;
    if (start > 0) {
      for (let i = start - 1; i >= 0; i--) {
        if (!/[-*+]\s/.test(art[i]) || uiText.test(art[i])) continue;
        const items = art[i].split(/\s*[-*+]\s+/).map(s => s
          .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
          .replace(/[*_`#>]/g, '')
          .trim()).filter(s => s.length >= 20);
        if (items.length) { subtitle = items.slice(0, 2).join(' · '); break; }
      }
    }
    const out = [];
    for (let p = 0; p <= body.length; p++) {
      if (p > 0) out.push(body[p - 1]);
      for (const f of figs) {
        if (f.after === p) { out.push(f.image); if (f.caption) out.push(f.caption); }
      }
    }
    // Mantém Title/Published Time para o título da página e do cabeçalho
    const meta = String(bodyMd).split('Markdown Content:')[0];
    return { text: meta + 'Markdown Content:\n\n' + out.join('\n\n'), subtitle };
  }

  // --- Carregar artigo ---
  function renderArticleHead(title, url, subtitle) {
    if (/^\s*<h1/i.test(output.innerHTML)) return;
    const head = document.createElement('header');
    head.className = 'article-head';
    const back = document.createElement('button');
    back.type = 'button';
    back.className = 'back-news';
    back.textContent = '← Notícias';
    back.onclick = () => showView('news');
    const h = document.createElement('h1');
    h.textContent = title;
    let host = '';
    try { host = new URL(url).hostname.replace(/^www\d*\./i, ''); } catch {}
    const src = document.createElement('a');
    src.href = url;
    src.target = '_blank';
    src.rel = 'noopener';
    src.textContent = 'Abrir no site' + (host ? ' · ' + host : '');
    head.append(back, h);
    if (subtitle) {
      const sub = document.createElement('p');
      sub.className = 'article-sub';
      sub.textContent = subtitle;
      head.appendChild(sub);
    }
    head.appendChild(src);
    output.prepend(head);
  }

  // Formatos que não são artigos legíveis: coberturas ao vivo e podcasts
  function specialKind(url) {
    try {
      const u = new URL(url);
      if (/(^|\.)aovivo\./i.test(u.hostname)) return 'live';
      if (/^\/podcasts\//.test(u.pathname)) return 'podcast';
    } catch {}
    return '';
  }

  function renderSpecial(url, kind) {
    const title = kind === 'live' ? 'Cobertura ao vivo' : 'Podcast';
    const sub = kind === 'live'
      ? 'Esta cobertura é carregada pelo site da Folha. Abra no site para acompanhar as atualizações.'
      : 'Episódio de podcast. Abra no site para ouvir.';
    output.innerHTML = '';
    renderArticleHead(title, url, sub);
    status.textContent = title;
    document.title = title + ' — Leitura Diária';
    requestAnimationFrame(updateReadingProgress);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  let loadToken = 0;

  async function load() {
    const token = ++loadToken;
    const url = input.value.trim();
    if (!url) { status.textContent = 'Cole uma URL primeiro.'; return; }
    const kind = specialKind(url);
    if (kind) {
      renderSpecial(url, kind);
      saveHistory(url, kind === 'live' ? 'Cobertura ao vivo' : 'Podcast');
      return;
    }
    output.innerHTML = '';
    updateReadingProgress();
    status.textContent = 'Extraindo… (pode levar alguns segundos)';
    goBtn.disabled = true;
    try {
      const article = await fetchArticle(url);
      const text = article.text;
      if (token !== loadToken) return;
      if (!text || text.length < 200) throw new Error('Conteúdo muito curto ou vazio');
      const title = extractTitle(text) || url;
      output.innerHTML = mdToHtml(text);
      renderArticleHead(title, url, article.subtitle);
      const words = (text.match(/\S+/g) || []).length;
      status.textContent = 'Pronto. ' + text.length + ' caracteres · ~' +
        Math.max(1, Math.round(words / 220)) + ' min de leitura' +
        (text.length < 1200 ? ' · conteúdo curto (pode ser paywall)' : '');
      requestAnimationFrame(updateReadingProgress);
      document.title = title + ' — Leitura Diária';
      saveHistory(url, title);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      if (token !== loadToken) return;
      status.innerHTML = 'Falha: ' + esc(e.message) +
        '<br>Tente novamente ou abra a URL diretamente no navegador.';
    } finally {
      goBtn.disabled = false;
    }
  }

  goBtn.onclick = load;
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });

  // --- Notícias (manchetes das seções da Folha) ---
  const SECTIONS = [
    { id: 'ultimas', label: 'Últimas', url: 'https://www1.folha.uol.com.br/ultimas-noticias/' },
    { id: 'opiniao', label: 'Opinião', url: 'https://www1.folha.uol.com.br/opiniao/' },
    { id: 'poder', label: 'Poder', url: 'https://www1.folha.uol.com.br/poder/' },
    { id: 'mercado', label: 'Mercado', url: 'https://www1.folha.uol.com.br/mercado/' },
    { id: 'mundo', label: 'Mundo', url: 'https://www1.folha.uol.com.br/mundo/' },
    { id: 'cotidiano', label: 'Cotidiano', url: 'https://www1.folha.uol.com.br/cotidiano/' },
    { id: 'esporte', label: 'Esporte', url: 'https://www1.folha.uol.com.br/esporte/' },
    { id: 'f5', label: 'F5', url: 'https://f5.folha.uol.com.br/' }
  ];
  const MONTHS = { jan: '01', fev: '02', mar: '03', abr: '04', mai: '05', jun: '06', jul: '07', ago: '08', set: '09', out: '10', nov: '11', dez: '12' };
  const readerView = $('readerView'), newsView = $('newsView');
  const tabReader = $('tabReader'), tabNews = $('tabNews');
  const newsSections = $('newsSections'), newsSubs = $('newsSubs');
  const subsRow = $('subsRow'), subsLabel = $('subsLabel');
  const newsStatus = $('newsStatus'), newsList = $('newsList');
  const NEWS_KEY = 'leitor_limpo_news_v3_';
  const READ_KEY = 'leitor_limpo_read_v1';
  const PERIOD_KEY = 'leitor_limpo_period_v1';
  const PERIODS = [
    { label: '1h', ms: 3600e3 },
    { label: '3h', ms: 3 * 3600e3 },
    { label: '6h', ms: 6 * 3600e3 },
    { label: '12h', ms: 12 * 3600e3 },
    { label: '24h', ms: 24 * 3600e3 },
    { label: '7d', ms: 7 * 24 * 3600e3 },
    { label: 'Tudo', ms: 0 }
  ];
  const periodsBox = $('newsPeriods');
  let periodMs = 24 * 3600e3;
  try {
    const saved = parseInt(localStorage.getItem(PERIOD_KEY), 10);
    if (PERIODS.some(p => p.ms === saved)) periodMs = saved;
  } catch {}
  let currentItems = [];
  let currentSection = 'ultimas';
  let currentFeed = { url: '', label: '' };
  let currentTopics = [];
  let newsStarted = false;
  let newsScroll = 0;

  function getRead() {
    try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]')); } catch { return new Set(); }
  }
  function markRead(url) {
    const s = getRead();
    s.add(url);
    try { localStorage.setItem(READ_KEY, JSON.stringify(Array.from(s).slice(-500))); } catch {}
  }

  function showView(name) {
    const fromNews = !newsView.classList.contains('hidden');
    if (name === 'reader' && fromNews) newsScroll = window.scrollY;
    readerView.classList.toggle('hidden', name !== 'reader');
    newsView.classList.toggle('hidden', name !== 'news');
    tabReader.classList.toggle('active', name === 'reader');
    tabNews.classList.toggle('active', name === 'news');
    if (name === 'news' && !newsStarted) { newsStarted = true; selectSection(currentSection); }
    if (name === 'news' && !fromNews) requestAnimationFrame(() => window.scrollTo(0, newsScroll));
    updateReadingProgress();
  }
  tabReader.onclick = () => showView('reader');
  tabNews.onclick = () => showView('news');

  SECTIONS.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s.label;
    b.dataset.id = s.id;
    b.onclick = () => selectSection(s.id);
    newsSections.appendChild(b);
  });

  PERIODS.forEach(p => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = p.label;
    b.dataset.ms = p.ms;
    b.onclick = () => {
      periodMs = p.ms;
      try { localStorage.setItem(PERIOD_KEY, periodMs); } catch {}
      highlightPeriod();
      if (currentItems.length) renderNews(currentItems);
    };
    periodsBox.appendChild(b);
  });
  function highlightPeriod() {
    for (const b of periodsBox.children) b.classList.toggle('active', +b.dataset.ms === periodMs);
  }
  highlightPeriod();

  function filterByPeriod(items) {
    if (!periodMs) return items;
    const now = Date.now();
    return items.filter(it => it.ts && now - it.ts <= periodMs);
  }
  function periodLabel() {
    const p = PERIODS.find(x => x.ms === periodMs);
    return !p || !p.ms ? 'tudo' : 'últimas ' + p.label;
  }

  function selectSection(id) {
    currentSection = id;
    const sec = SECTIONS.find(s => s.id === id);
    currentFeed = { url: sec.url, label: sec.label };
    for (const b of newsSections.children) b.classList.toggle('active', b.dataset.id === id);
    newsSubs.innerHTML = '';
    subsRow.classList.add('hidden');
    openFeed();
  }

  function selectTopic(label, url) {
    currentFeed = { url, label };
    openFeed();
  }

  $('newsRefresh').onclick = () => {
    try { localStorage.removeItem(NEWS_KEY + encodeURIComponent(currentFeed.url)); } catch {}
    newsSubs.innerHTML = '';
    subsRow.classList.add('hidden');
    newsStatus.textContent = 'Atualizando…';
    loadNews(currentFeed, SECTIONS.find(s => s.id === currentSection).url);
  };

  function openFeed() {
    const sec = SECTIONS.find(s => s.id === currentSection);
    for (const b of newsSubs.children) b.classList.toggle('active', b.dataset.url === currentFeed.url);
    newsList.innerHTML = '';
    const cached = readNewsCache(currentFeed.url);
    if (cached) {
      currentTopics = cached.topics || [];
      renderNews(cached.items);
      renderSubs(sec.url);
      return;
    }
    newsStatus.textContent = 'Carregando manchetes…';
    loadNews(currentFeed, sec.url);
  }

  function readNewsCache(url) {
    try {
      const data = JSON.parse(localStorage.getItem(NEWS_KEY + encodeURIComponent(url)) || 'null');
      if (!data || Date.now() - data.ts > 10 * 60 * 1000) return null;
      return data;
    } catch { return null; }
  }

  async function loadNews(feed, sectionUrl) {
    try {
      const res = await fetch('https://r.jina.ai/' + feed.url, { headers: { 'Accept': 'text/plain' } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const md = await res.text();
      const items = parseNews(md);
      const topics = parseTopics(md, sectionUrl);
      if (!items.length) throw new Error('nenhuma notícia encontrada');
      try {
        localStorage.setItem(NEWS_KEY + encodeURIComponent(feed.url), JSON.stringify({ ts: Date.now(), items, topics }));
      } catch {}
      if (currentFeed.url === feed.url) {
        currentTopics = topics;
        renderNews(items);
        renderSubs(sectionUrl);
      }
    } catch (e) {
      if (currentFeed.url === feed.url) {
        newsStatus.textContent = 'Falha ao carregar: ' + e.message;
        newsList.innerHTML = '';
        const p = document.createElement('p');
        p.className = 'hint';
        const link = document.createElement('a');
        link.href = feed.url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = feed.url;
        p.append('Tente outra seção ou abra ', link, '.');
        newsList.appendChild(p);
      }
    }
  }

  function renderSubs(sectionUrl) {
    newsSubs.innerHTML = '';
    if (currentFeed.url !== sectionUrl) newsSubs.appendChild(subChip('Tudo', sectionUrl));
    for (const t of currentTopics) newsSubs.appendChild(subChip(t.label, t.url));
    const has = newsSubs.children.length > 0;
    subsRow.classList.toggle('hidden', !has);
    if (has) {
      const sec = SECTIONS.find(s => s.url === sectionUrl);
      subsLabel.textContent = 'Tópicos de ' + (sec ? sec.label : 'seção');
    }
  }

  function subChip(label, url) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.dataset.url = url;
    if (url === currentFeed.url) b.classList.add('active');
    b.onclick = () => selectTopic(label, url);
    return b;
  }

  // A barra de subtópicos é a lista que começa no link da própria seção
  function parseTopics(md, sectionUrl) {
    const content = String(md).split('Markdown Content:').pop();
    const base = new URL(sectionUrl);
    const basePath = base.pathname.replace(/\/?$/, '/');
    const linkRe = /^\s*[-*+]\s+\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/;
    const groups = [];
    let group = [];
    for (const line of content.split('\n')) {
      const m = line.match(linkRe);
      if (m) { group.push({ label: cleanLabel(m[1]), url: m[2] }); continue; }
      if (group.length) { groups.push(group); group = []; }
    }
    if (group.length) groups.push(group);
    for (const g of groups) {
      if (g.length < 3) continue;
      let firstPath = '';
      try { firstPath = new URL(g[0].url).pathname; } catch { continue; }
      if (firstPath !== basePath) continue;
      const topics = [], seen = new Set();
      for (const item of g.slice(1)) {
        try {
          const u = new URL(item.url);
          if (u.hostname !== base.hostname || !u.pathname.endsWith('/')) continue;
          if (u.pathname === basePath || u.hash) continue;
          if (!item.label || item.label.length < 2 || item.label.length > 45) continue;
          if (seen.has(u.href)) continue;
          seen.add(u.href);
          topics.push({ label: item.label, url: u.href });
        } catch {}
      }
      if (topics.length) return topics.slice(0, 12);
    }
    return [];
  }

  function cleanLabel(s) {
    return String(s)
      .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
      .replace(/[*_`#>]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function isArticleUrl(url) {
    try {
      const u = new URL(url);
      if (!/(^|\.)folha\.uol\.com\.br$/i.test(u.hostname) && !/(^|\.)folha\.com\.br$/i.test(u.hostname)) return false;
      return /\/\d{4}\/\d{2}\/[^/]+\.shtml$/.test(u.pathname);
    } catch { return false; }
  }

  function fmtNewsDate(s) {
    const m = s.match(/(\d{2})\.([a-z]{3})\.(\d{4})\s+às\s+(\d{1,2})h(\d{2})/i);
    if (!m) return '';
    const mm = MONTHS[m[2].toLowerCase()] || '';
    const hh = m[4] + 'h' + m[5];
    const now = new Date();
    if (+m[1] === now.getDate() && +mm === now.getMonth() + 1) return 'hoje ' + hh;
    const y = new Date(now);
    y.setDate(y.getDate() - 1);
    if (+m[1] === y.getDate() && +mm === y.getMonth() + 1) return 'ontem ' + hh;
    return m[1] + '/' + mm + ' ' + hh;
  }

  // Separa manchete e subtítulo usando o slug da URL como âncora
  function splitHeadline(text, url) {
    const none = { title: text, subtitle: '' };
    let slug = '';
    try { slug = new URL(url).pathname.split('/').pop().replace(/\.shtml$/, ''); } catch { return none; }
    const tokensOf = (s) => (s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().match(/[a-z0-9]+/g) || []);
    const slugTokens = tokensOf(slug);
    if (!slugTokens.length) return none;
    const words = [];
    const re = /\S+/g;
    let m;
    while ((m = re.exec(text))) words.push({ start: m.index, end: m.index + m[0].length, toks: tokensOf(m[0]) });
    const flat = [];
    words.forEach((w, wi) => w.toks.forEach(t => flat.push([t, wi])));
    const n = slugTokens.length;
    for (let i = 0; i + n <= flat.length; i++) {
      let ok = true;
      for (let j = 0; j < n; j++) if (flat[i + j][0] !== slugTokens[j]) { ok = false; break; }
      if (!ok) continue;
      const start = words[flat[i][1]].start;
      const end = words[flat[i + n - 1][1]].end;
      const title = text.slice(start, end).replace(/[\s,;:.!?-]+$/, '').trim();
      const subtitle = text.slice(end).replace(/^[\s,;:.!?-]+/, '').trim();
      if (title.length >= 10) return { title, subtitle };
      break;
    }
    return none;
  }

  function parseNews(md) {
    const content = String(md).split('Markdown Content:').pop();
    const thumbs = {};
    const imgRe = /\[!\[[^\]]*\]\(([^)\s]+)\)\]\((https?:\/\/[^)\s]+)\)/g;
    let m;
    while ((m = imgRe.exec(content))) thumbs[m[2]] = m[1];
    const items = [], seen = new Set();
    const linkRe = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;
    while ((m = linkRe.exec(content))) {
      const url = m[2];
      if (seen.has(url) || !isArticleUrl(url)) continue;
      let text = m[1]
        .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
        .replace(/[*_`#>]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      if (text.length < 12) continue;
      const dm = text.match(/(\d{2})\.([a-z]{3})\.(\d{4})\s+às\s+(\d{1,2})h(\d{2})\s*$/i);
      const date = dm ? fmtNewsDate(dm[0]) : '';
      let ts = 0;
      if (dm) {
        const mo = parseInt(MONTHS[dm[2].toLowerCase()] || '', 10);
        if (mo) ts = new Date(+dm[3], mo - 1, +dm[1], +dm[4], +dm[5]).getTime();
        text = text.slice(0, dm.index).trim();
      }
      if (!text) continue;
      seen.add(url);
      const split = splitHeadline(text, url);
      const img = thumbs[url] || '';
      items.push({ title: split.title, subtitle: split.subtitle, url, date, ts, img: /^https:\/\//.test(img) ? img : '' });
      if (items.length >= 100) break;
    }
    return items;
  }

  function renderNews(items) {
    currentItems = items;
    const shown = filterByPeriod(items);
    newsList.innerHTML = '';
    if (!shown.length) {
      newsStatus.textContent = items.length
        ? 'Nenhuma notícia em ' + periodLabel() + ' · amplie o período'
        : 'Nenhuma notícia encontrada.';
      return;
    }
    newsStatus.textContent = shown.length + (shown.length === 1 ? ' notícia · ' : ' notícias · ') + periodLabel() + ' · toque para ler';
    const read = getRead();
    for (const it of shown) {
      const a = document.createElement('a');
      a.className = 'news-item';
      a.href = it.url;
      if (read.has(it.url)) a.classList.add('read');
      a.onclick = (e) => { e.preventDefault(); markRead(it.url); a.classList.add('read'); input.value = it.url; showView('reader'); load(); };
      const info = document.createElement('div');
      info.className = 'news-info';
      const title = document.createElement('span');
      title.className = 'news-title';
      title.textContent = it.title;
      info.appendChild(title);
      if (it.subtitle) {
        const sub = document.createElement('span');
        sub.className = 'news-sub';
        sub.textContent = it.subtitle;
        info.appendChild(sub);
      }
      if (it.date) {
        const date = document.createElement('span');
        date.className = 'news-date';
        date.textContent = it.date;
        info.appendChild(date);
      }
      a.appendChild(info);
      if (it.img) {
        const img = document.createElement('img');
        img.src = it.img; img.alt = ''; img.loading = 'lazy';
        a.appendChild(img);
      }
      newsList.appendChild(a);
    }
  }

  // --- Preferências de leitura ---
  const FONT_KEY = 'leitor_limpo_font_v1';
  const toTop = $('toTop');
  const readFooter = $('readFooter');
  const readPct = $('readPct'), readPage = $('readPage');

  function updateReadingProgress() {
    const show = newsView.classList.contains('hidden') && output.innerHTML.trim() !== '';
    readFooter.classList.toggle('hidden', !show);
    if (!show) return;
    const vh = window.innerHeight;
    const docHeight = document.documentElement.scrollHeight;
    const max = Math.max(1, docHeight - vh);
    const pct = Math.round(Math.min(1, Math.max(0, window.scrollY / max)) * 100);
    const totalPages = Math.max(1, Math.ceil(docHeight / vh));
    const page = Math.min(totalPages, Math.max(1, Math.round(pct * totalPages / 100)));
    readPct.textContent = pct + '%';
    readPage.textContent = 'página ' + page + ' de ' + totalPages;
  }

  let fontSize = 18;
  try { fontSize = parseInt(localStorage.getItem(FONT_KEY), 10) || 18; } catch {}
  fontSize = Math.min(26, Math.max(15, fontSize));
  function applyFont() {
    output.style.fontSize = fontSize + 'px';
    updateReadingProgress();
  }
  applyFont();
  $('fontMinus').onclick = () => {
    fontSize = Math.max(15, fontSize - 1);
    applyFont();
    try { localStorage.setItem(FONT_KEY, fontSize); } catch {}
  };
  $('fontPlus').onclick = () => {
    fontSize = Math.min(26, fontSize + 1);
    applyFont();
    try { localStorage.setItem(FONT_KEY, fontSize); } catch {}
  };

  // --- Fonte e cor do texto (cíclicos: um clique muda para a próxima) ---
  const FONTS = [
    { name: 'Georgia', css: 'Georgia, "Times New Roman", serif' },
    { name: 'Literata', css: '"Literata", Georgia, serif' },
    { name: 'Lora', css: '"Lora", Georgia, serif' },
    { name: 'Merriweather', css: '"Merriweather", Georgia, serif' }
  ];
  const TEXT_COLORS = ['#222222', '#4a3b2a', '#263d5c', '#5a2f2f'];
  const TYPEFACE_KEY = 'leitor_limpo_typeface_v1';
  const TEXT_COLOR_KEY = 'leitor_limpo_color_v1';
  const btnFont = $('btnFont'), btnColor = $('btnColor');
  const aaPreview = btnFont.querySelector('.aa');
  const colorPreview = btnColor.querySelector('.color-a');
  let fontIndex = 0, colorIndex = 0;
  try { fontIndex = parseInt(localStorage.getItem(TYPEFACE_KEY), 10) || 0; } catch {}
  try { colorIndex = parseInt(localStorage.getItem(TEXT_COLOR_KEY), 10) || 0; } catch {}

  function applyTypeface() {
    const f = FONTS[fontIndex % FONTS.length];
    output.style.fontFamily = f.css;
    aaPreview.style.fontFamily = f.css;
    btnFont.title = 'Fonte: ' + f.name;
    btnFont.setAttribute('aria-label', 'Mudar fonte (atual: ' + f.name + ')');
    updateReadingProgress();
  }
  function applyTextColor() {
    const c = TEXT_COLORS[colorIndex % TEXT_COLORS.length];
    output.style.color = c;
    colorPreview.style.color = c;
    colorPreview.style.borderBottomColor = c;
    btnColor.title = 'Cor do texto: ' + c;
    btnColor.setAttribute('aria-label', 'Mudar cor do texto (atual: ' + c + ')');
  }
  applyTypeface();
  applyTextColor();
  btnFont.onclick = () => {
    fontIndex = (fontIndex + 1) % FONTS.length;
    applyTypeface();
    try { localStorage.setItem(TYPEFACE_KEY, fontIndex); } catch {}
  };
  btnColor.onclick = () => {
    colorIndex = (colorIndex + 1) % TEXT_COLORS.length;
    applyTextColor();
    try { localStorage.setItem(TEXT_COLOR_KEY, colorIndex); } catch {}
  };
  window.addEventListener('scroll', () => {
    toTop.classList.toggle('hidden', window.scrollY < 600);
    updateReadingProgress();
  }, { passive: true });
  window.addEventListener('resize', updateReadingProgress);
  toTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== input) {
      e.preventDefault();
      input.focus();
    }
  });

  renderHistory();

  // Pré-preenche com a URL do parâmetro ?u= (útil como atalho)
  const q = new URLSearchParams(location.search).get('u');
  if (q) { input.value = q; load(); }

  // Aba de notícias via link direto (?v=news ou #noticias)
  if (/[?&]v=news\b/.test(location.search) || location.hash === '#noticias') showView('news');
})();
</script>
</body>
</html>
